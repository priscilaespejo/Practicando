<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tienda de Ropa</title>
</head>
<body>

  <header>
    <h1>Moda Urbana</h1>
    <p>Tu tienda de ropa moderna</p>

  <nav>

    <a href="#">Hombres</a>
    <a href="#">Mujeres</a>
    <a href="#">Accesorios</a>
    <a href="#">Contacto</a>
  </nav>

  <section class="productos">
    <div class="producto">
      <img src="https://via.placeholder.com/250x300?text=Camisa+Hombre" alt="Camisa Hombre">
      <h3>Camisa Casual</h3>
      <p>$25.00</p>
      <button>Agregar al carrito</button>

  <footer>
    <p>&copy; 2025 Moda Urbana. Todos los derechos reservados.</p>
